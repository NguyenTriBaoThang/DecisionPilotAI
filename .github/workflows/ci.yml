name: DecisionPilot AI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build production bundle
        working-directory: frontend
        run: npm run build

      - name: Frontend workflow regression tests
        working-directory: frontend
        run: npm test

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-check:
    name: Backend Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            url: ''
          - database: postgresql
            url: postgresql+psycopg://decisionpilot:test-only@localhost:5432/decisionpilot
    env:
      DATABASE_URL: ${{ matrix.url }}
      TEST_DATABASE_URL: ${{ matrix.url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decisionpilot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: decisionpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisionpilot -d decisionpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Bootstrap synthetic demo dataset
        run: python -m scripts.bootstrap

      - name: Run automated test suite
        run: python -m pytest -q

      - name: Validate data pipeline integrity
        run: python -m scripts.pipeline validate

  browser-workflow:
    name: Browser decision workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile build
        run: docker build -t decisionpilot-ai:ci .

