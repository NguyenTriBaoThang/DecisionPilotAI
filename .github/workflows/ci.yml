name: DecisionPilot AI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build production bundle
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against SQLite
        run: python -m alembic upgrade head

      - name: Bootstrap synthetic demo dataset
        run: python -m scripts.bootstrap

      - name: Run automated test suite
        run: python -m pytest -q

      - name: Validate data pipeline integrity
        run: python -m scripts.pipeline validate

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile build
        run: docker build -t decisionpilot-ai:ci .

