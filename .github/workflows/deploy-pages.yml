name: Deploy Documentation Site & Live App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation Portal & Live App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            frontend/package-lock.json

      - name: Install & Build Technical Documentation Site
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Install & Build Frontend Application
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --base=/DecisionPilotAI/app/

      - name: Bundle Documentation & Live App Artifacts
        run: |
          mkdir -p docs-site/dist/app
          cp -r frontend/dist/* docs-site/dist/app/
          python3 -c '
          from pathlib import Path
          html = Path("docs-site/dist/index.html").read_text(encoding="utf-8")
          script = (
              "<script>(function(){var p=location.pathname;"
              "if(p.startsWith(\"/DecisionPilotAI/app\")){"
              "sessionStorage.setItem(\"dp-spa-redirect\",p+location.search+location.hash);"
              "location.replace(\"/DecisionPilotAI/app/\");"
              "}else if(p.startsWith(\"/DecisionPilotAI/\")){"
              "sessionStorage.setItem(\"dp-docs-redirect\",p+location.search+location.hash);"
              "location.replace(\"/DecisionPilotAI/\");"
              "}})();</script>"
          )
          Path("docs-site/dist/404.html").write_text(html.replace("<head>", "<head>" + script, 1), encoding="utf-8")
          '
          cp docs-site/dist/app/index.html docs-site/dist/app/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
