services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisionpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionpilot_local}
      POSTGRES_DB: ${POSTGRES_DB:-decisionpilot}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - decisionpilot_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 4s
      timeout: 4s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-decisionpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionpilot_local}
      POSTGRES_DB: ${POSTGRES_DB:-decisionpilot}
      POSTGRES_HOST: postgres
      ROOT_PATH: /api
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEMO_ALLOW_IMPORT: ${DEMO_ALLOW_IMPORT:-false}
      IMPORT_TOKEN: ${IMPORT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 25
  frontend:
    build: frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  decisionpilot_db:
